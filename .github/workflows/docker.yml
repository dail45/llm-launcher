name: docker-build

# Verifies that the Dockerfile cross-build (Linux -> Windows) works.
on:
  push:
    branches: [master]
    paths: ['Dockerfile', '.dockerignore', '.github/workflows/docker.yml']
  workflow_dispatch:

jobs:
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build via Dockerfile
        run: docker buildx build --target export --output type=local,dest=dist .
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: llama-launcher-windows-docker
          path: dist/*
