name: docker-build

# Manual only: verifies that the Dockerfile cross-build (Linux -> Windows) works.
on:
  workflow_dispatch:

jobs:
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build via Dockerfile
        run: docker buildx build --target export --build-arg LLL_GIT_SHA=${GITHUB_SHA::7} --output type=local,dest=dist .
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: llama-launcher-windows-docker
          path: dist/*
